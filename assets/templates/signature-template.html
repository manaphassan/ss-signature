<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.0 Transitional//EN">
<HTML><HEAD><TITLE>Email Signature</TITLE>
<META content="text/html; charset=utf-8" http-equiv="Content-Type">
</HEAD>
<BODY style="font-size: 10pt; font-family: Arial, sans-serif;">

<table style="width: 430px; font-size: 11pt; font-family: Arial, sans-serif;" cellspacing="0" cellpadding="0" border="0">
<tbody>

 <tr>
	<td colspan="2" style="border-bottom:1px dotted #000; padding-bottom:10px;">
		<strong><span style="font-size: 18pt; font-family: Arial, sans-serif; color:{{primaryColor}};">{{firstName}} {{lastName}}</span></strong>
                <span><br></span>
                <strong style="font-family: Arial, sans-serif; font-size:10pt; color:#000000;">{{position}}</strong>	
		<strong><span><span> | </span><a href="http://{{website}}" target="_blank" rel="noopener" style="text-decoration:none;"><span style="font-size: 10pt; font-family: Arial, sans-serif; color:#000000;"> {{website}}</span></a></span></strong>
		
	</td>
  </tr>
  
 <tr>
	<td colspan="2" style="font-size:1px; height:15px;line-height:1px">&nbsp;</td>
  </tr>
  
 <tr>
  <td style="text-align:center; font-size: 10pt; font-family: Arial, sans-serif; width: 140px; vertical-align: top;" width="140" valign="top" align="center">
		<a href="http://{{website}}" target="_blank"><img alt="Logo" style="width:120px; height:auto; border:0;" src="{{logoUrl}}" width="120" border="0"></a>
		   
  </td>
    
 <td style="padding-left:15px;" valign="top">
  <table cellspacing="0" cellpadding="0" border="0">
  <tbody>
    <tr>
      <td style="font-size: 9pt; font-family: Arial, sans-serif; vertical-align: top; line-height:15px;" valign="top">
	  
		<span><span style="color: #000000; font-family: Arial, sans-serif; font-size:12px"><strong>Office:</strong> {{officePhone}}<br></span></span>
		<span><span style="color: #000000; font-family: Arial, sans-serif; font-size:12px"><strong>Mobile:</strong> {{mobilePhone}}<br></span></span>
		<span><span style="color: #000000; font-family: Arial, sans-serif; font-size:12px"><strong>Email:</strong> {{email}}<br></span></span>
		
		<span>
			<span style="color: #000000; font-family: Arial, sans-serif; font-size:12px"><strong>Address: </strong></span>
			<span style="color: #000000; font-family: Arial, sans-serif; font-size:12px;">{{address}}</span>
		</span>

      </td>
    </tr>
    <tr>
      <td style="vertical-align: bottom; padding-top:5px;" valign="bottom">
        {{socialIcons}}
      </td>
     </tr>
  </tbody>
  </table>
 </td></tr> 
 
 <tr>
	<td colspan="2" style="font-size:1px; height:15px;line-height:1px">&nbsp;</td>
  </tr>
  
	<tr>
		<td colspan="2" style="padding-top:15px; border-top:1px dotted #000">
			<a href="http://{{website}}" target="_blank" rel="noopener"><img src="{{bannerUrl}}" alt="Banner" style="max-width:528px; height:auto; border:0;" border="0"></a>
			
		</td>
	</tr>
		 
 <tr>
	<td colspan="2" style="padding-top:15px; line-height:13px; font-size: 7pt; color: #959595; font-family: Arial, sans-serif;">{{disclaimer}}</td>
  </tr>
	 
</tbody>
</table>

</BODY>
</HTML>
